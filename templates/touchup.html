{% extends "base.html" %}
{% set pageclass = "pg-touchup" %}
{% block content %}
<div class="touchup-card">
  <h2 class="formtitle">touch up this photo</h2>

  <div class="touchup-toolbar">
    <div class="modeswitch" id="mode-switch">
      <button type="button" class="modebtn active" data-mode="erase">Erase</button>
      <button type="button" class="modebtn" data-mode="restore" {{ 'disabled' if not raw_url }}>Paint back</button>
    </div>
    <label class="brushctl">
      brush size
      <input type="range" id="brushSize" min="8" max="140" value="40">
    </label>
    <button type="button" class="toolbtn" id="rotateBtn">Rotate</button>
    <button type="button" class="toolbtn" id="undoBtn">Undo</button>
    <button type="button" class="toolbtn" id="restoreOriginalBtn" {{ 'disabled' if not raw_url }}>Restore original</button>
    <button type="button" class="toolbtn" id="resetBtn">Reset</button>
  </div>

  <div class="touchup-canvaswrap">
    <canvas id="board"></canvas>
    <div class="brushcursor" id="brushCursor" hidden></div>
  </div>

  <div class="formbtnrow">
    <button type="button" class="savebtn cutebtn" id="saveBtn">
      <span class="btnlabel">save changes</span>
    </button>
    <a class="cancelbtn cutebtn" href="{{ url_for('edit_item', item_id=item_id) }}#restore-draft">Cancel</a>
  </div>
</div>

<img id="processedSrc" src="{{ url_for('photos', filename=processed_filename) }}" style="display:none">
{% if raw_url %}<img id="rawSrc" src="{{ raw_url }}" style="display:none">{% endif %}
{% endblock %}

{% block scripts %}
<script>
(function () {
  var processedImg = document.getElementById('processedSrc');
  var rawImg = document.getElementById('rawSrc');  // may be null (no raw on file)
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var cursor = document.getElementById('brushCursor');
  var brushSizeInput = document.getElementById('brushSize');
  var drawing = false;
  var lastPoint = null;
  var undoStack = [];
  var MAX_UNDO = 15;
  var initDone = false;
  var initialSnapshot = null;   // the canvas exactly as the page opened
  var mode = 'erase';
  // How far the canvas has been rotated (clockwise degrees) relative to
  // the processed/raw source images, which never rotate themselves — only
  // matters for drawing FROM those sources (paint-back, restore original);
  // ordinary brush strokes just edit whatever's already on the canvas, so
  // they don't care about this.
  var rotationDeg = 0;

  // Undo/Reset need to restore the canvas's *size* too, not just its
  // pixels — a rotation swaps width/height, and getImageData/putImageData
  // alone can't do that.
  function snapshot() {
    return {
      data: ctx.getImageData(0, 0, canvas.width, canvas.height),
      width: canvas.width,
      height: canvas.height,
      rotationDeg: rotationDeg,
    };
  }

  function restoreSnapshot(snap) {
    canvas.width = snap.width;
    canvas.height = snap.height;
    ctx.putImageData(snap.data, 0, 0);
    rotationDeg = snap.rotationDeg;
    fitCanvas();
  }

  // Draws a source image (the original processed cutout, or the raw photo)
  // rotated to match the canvas's current orientation. Needed because
  // those source <img> elements never rotate themselves — only the canvas
  // (and whatever's already drawn on it) does.
  function drawSourceRotated(image, targetCtx, targetW, targetH) {
    targetCtx.save();
    targetCtx.translate(targetW / 2, targetH / 2);
    targetCtx.rotate(rotationDeg * Math.PI / 180);
    targetCtx.drawImage(image, -image.naturalWidth / 2, -image.naturalHeight / 2);
    targetCtx.restore();
  }

  function init() {
    if (initDone) return;
    if (!processedImg.naturalWidth) return;
    initDone = true;
    canvas.width = processedImg.naturalWidth;
    canvas.height = processedImg.naturalHeight;
    ctx.drawImage(processedImg, 0, 0, canvas.width, canvas.height);
    initialSnapshot = snapshot();
    fitCanvas();
    canvas.classList.add('jsready');
  }

  function fitCanvas() {
    var wrap = canvas.parentElement;
    var maxW = Math.min(wrap.clientWidth || 640, 640);
    var scale = Math.min(1, maxW / canvas.width);
    canvas.style.width = (canvas.width * scale) + 'px';
    canvas.style.height = (canvas.height * scale) + 'px';
  }

  if (processedImg.complete) { init(); } else { processedImg.addEventListener('load', init); }
  window.addEventListener('resize', fitCanvas);

  document.getElementById('mode-switch').addEventListener('click', function (e) {
    var btn = e.target.closest('.modebtn');
    if (!btn || btn.disabled) return;
    mode = btn.dataset.mode;
    document.querySelectorAll('.modebtn').forEach(function (b) {
      b.classList.toggle('active', b === btn);
    });
    canvas.classList.toggle('restoring', mode === 'restore');
  });

  function canvasPoint(e) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height),
    };
  }

  function brushRadius() { return parseInt(brushSizeInput.value, 10) / 2; }

  function dab(x, y) {
    var r = brushRadius();
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    if (mode === 'restore' && rawImg && rawImg.naturalWidth) {
      // paint the matching patch of the original photo back into the brush
      ctx.clip();
      ctx.globalCompositeOperation = 'source-over';
      drawSourceRotated(rawImg, ctx, canvas.width, canvas.height);
    } else {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fill();
    }
    ctx.restore();
  }

  function strokeTo(pt) {
    if (lastPoint) {
      var dist = Math.hypot(pt.x - lastPoint.x, pt.y - lastPoint.y);
      var steps = Math.max(1, Math.ceil(dist / Math.max(2, brushRadius() * 0.4)));
      for (var i = 1; i <= steps; i++) {
        var t = i / steps;
        dab(lastPoint.x + (pt.x - lastPoint.x) * t, lastPoint.y + (pt.y - lastPoint.y) * t);
      }
    } else {
      dab(pt.x, pt.y);
    }
    lastPoint = pt;
  }

  function pushUndo() {
    undoStack.push(snapshot());
    if (undoStack.length > MAX_UNDO) undoStack.shift();
  }

  canvas.addEventListener('mousedown', function (e) {
    if (!initDone) return;
    drawing = true;
    lastPoint = null;
    pushUndo();
    strokeTo(canvasPoint(e));
  });
  canvas.addEventListener('mousemove', function (e) {
    if (!initDone) return;
    var rect = canvas.getBoundingClientRect();
    var dispScale = rect.width / canvas.width;
    cursor.hidden = false;
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
    cursor.style.width = (brushRadius() * 2 * dispScale) + 'px';
    cursor.style.height = (brushRadius() * 2 * dispScale) + 'px';
    if (drawing) strokeTo(canvasPoint(e));
  });
  window.addEventListener('mouseup', function () { drawing = false; lastPoint = null; });
  canvas.addEventListener('mouseleave', function () { cursor.hidden = true; });

  document.getElementById('undoBtn').addEventListener('click', function () {
    var prev = undoStack.pop();
    if (prev) restoreSnapshot(prev);
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!initDone || !initialSnapshot) return;
    pushUndo();
    restoreSnapshot(initialSnapshot);
  });

  // Rotates whatever's currently on the canvas 90° clockwise — click again
  // for 180/270. A fresh copy of the current pixels gets redrawn into a
  // width/height-swapped canvas; rotationDeg (tracked separately) is what
  // keeps paint-back/restore-original correctly oriented afterward, since
  // the source <img> elements themselves never rotate.
  document.getElementById('rotateBtn').addEventListener('click', function () {
    if (!initDone) return;
    pushUndo();
    var oldW = canvas.width, oldH = canvas.height;
    var copy = document.createElement('canvas');
    copy.width = oldW;
    copy.height = oldH;
    copy.getContext('2d').drawImage(canvas, 0, 0);
    canvas.width = oldH;
    canvas.height = oldW;
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(copy, -oldW / 2, -oldH / 2);
    ctx.restore();
    rotationDeg = (rotationDeg + 90) % 360;
    fitCanvas();
  });

  // For when the auto-cutout removed too much to fix with the paint-back
  // brush: replace the whole canvas with the untouched original photo
  // (background and all), then leave the user in Erase mode to cut it out
  // by hand. Distinct from Reset, which only reverts to the AI's cutout as
  // it looked when this page opened — not the original underlying photo.
  var restoreOriginalBtn = document.getElementById('restoreOriginalBtn');
  if (restoreOriginalBtn) {
    restoreOriginalBtn.addEventListener('click', function () {
      if (!initDone || !rawImg || !rawImg.naturalWidth) return;
      pushUndo();
      // Keep whatever rotation is already dialed in — if the photo needed
      // rotating to look right, the restored original should come back
      // the same way round, not flip back to how the raw file sits.
      var swapped = rotationDeg === 90 || rotationDeg === 270;
      canvas.width = swapped ? rawImg.naturalHeight : rawImg.naturalWidth;
      canvas.height = swapped ? rawImg.naturalWidth : rawImg.naturalHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSourceRotated(rawImg, ctx, canvas.width, canvas.height);
      mode = 'erase';
      document.querySelectorAll('.modebtn').forEach(function (b) {
        b.classList.toggle('active', b.dataset.mode === 'erase');
      });
      canvas.classList.remove('restoring');
      fitCanvas();
    });
  }

  document.getElementById('saveBtn').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    var label = btn.querySelector('.btnlabel');
    if (label) label.textContent = 'saving…';
    canvas.toBlob(function (blob) {
      var form = new FormData();
      form.append('image', blob, 'touchup.png');
      fetch(window.location.pathname, { method: 'POST', body: form })
        .then(function (res) {
          if (!res.ok) throw new Error('save failed');
          window.location.href = "{{ url_for('edit_item', item_id=item_id) }}#restore-draft";
        })
        .catch(function () {
          btn.disabled = false;
          if (label) label.textContent = 'save changes';
          alert("Couldn't save that — try again.");
        });
    }, 'image/png');
  });
})();
</script>
{% endblock %}
