{% extends "base.html" %}
{% set pageclass = "pg-touchup" %}
{% block content %}
<div class="touchup-card">
  <h2 class="formtitle">touch up this photo ✧</h2>
  <p class="subhint">Erase any leftover background bits the automatic cutout missed.</p>

  <div class="touchup-toolbar">
    <label class="brushctl">
      brush size
      <input type="range" id="brushSize" min="8" max="140" value="40">
    </label>
    <button type="button" class="toolbtn" id="undoBtn">Undo</button>
    <button type="button" class="toolbtn" id="resetBtn">Reset to original</button>
  </div>

  <div class="touchup-canvaswrap">
    <canvas id="board"></canvas>
    <div class="brushcursor" id="brushCursor" hidden></div>
  </div>

  <div class="formbtnrow">
    <button type="button" class="savebtn cutebtn" id="saveBtn">
      <svg class="btnsparkle" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
      <span class="btnlabel">save changes</span>
    </button>
    <a class="cancelbtn cutebtn" href="{{ url_for('edit_item', item_id=item_id) }}">Cancel</a>
  </div>
</div>

<img id="processedSrc" src="{{ url_for('photos', filename=processed_filename) }}" style="display:none">
{% endblock %}

{% block scripts %}
<script>
(function () {
  var processedImg = document.getElementById('processedSrc');
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var cursor = document.getElementById('brushCursor');
  var brushSizeInput = document.getElementById('brushSize');
  var drawing = false;
  var lastPoint = null;
  var undoStack = [];
  var MAX_UNDO = 12;
  // A persistent snapshot of the untouched processed image, taken once it
  // first loads. Reset draws from this canvas rather than the hidden <img>
  // itself, since some browsers stop reliably re-decoding an off-screen
  // display:none image once it hasn't been painted for a while.
  var originalCanvas = document.createElement('canvas');
  var originalCtx = originalCanvas.getContext('2d');
  var initDone = false;

  function init() {
    if (initDone) return;
    if (!processedImg.naturalWidth) return;
    initDone = true;
    canvas.width = processedImg.naturalWidth;
    canvas.height = processedImg.naturalHeight;
    ctx.drawImage(processedImg, 0, 0, canvas.width, canvas.height);
    originalCanvas.width = canvas.width;
    originalCanvas.height = canvas.height;
    originalCtx.drawImage(processedImg, 0, 0, canvas.width, canvas.height);
    fitCanvas();
    canvas.classList.add('jsready');
  }

  function fitCanvas() {
    var wrap = canvas.parentElement;
    var maxW = Math.min(wrap.clientWidth || 640, 640);
    var scale = Math.min(1, maxW / canvas.width);
    canvas.style.width = (canvas.width * scale) + 'px';
    canvas.style.height = (canvas.height * scale) + 'px';
  }

  if (processedImg.complete) {
    init();
  } else {
    processedImg.addEventListener('load', init);
  }
  window.addEventListener('resize', fitCanvas);

  function canvasPoint(e) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function brushRadius() {
    return parseInt(brushSizeInput.value, 10) / 2;
  }

  function dab(x, y) {
    var r = brushRadius();
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function strokeTo(pt) {
    if (lastPoint) {
      var dist = Math.hypot(pt.x - lastPoint.x, pt.y - lastPoint.y);
      var steps = Math.max(1, Math.ceil(dist / Math.max(2, brushRadius() * 0.5)));
      for (var i = 1; i <= steps; i++) {
        var t = i / steps;
        dab(lastPoint.x + (pt.x - lastPoint.x) * t, lastPoint.y + (pt.y - lastPoint.y) * t);
      }
    } else {
      dab(pt.x, pt.y);
    }
    lastPoint = pt;
  }

  function pushUndo() {
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (undoStack.length > MAX_UNDO) undoStack.shift();
  }

  canvas.addEventListener('mousedown', function (e) {
    if (!initDone) return;
    drawing = true;
    lastPoint = null;
    pushUndo();
    strokeTo(canvasPoint(e));
  });
  canvas.addEventListener('mousemove', function (e) {
    if (!initDone) return;
    var rect = canvas.getBoundingClientRect();
    var dispScale = rect.width / canvas.width;
    cursor.hidden = false;
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
    cursor.style.width = (brushRadius() * 2 * dispScale) + 'px';
    cursor.style.height = (brushRadius() * 2 * dispScale) + 'px';
    if (drawing) strokeTo(canvasPoint(e));
  });
  window.addEventListener('mouseup', function () { drawing = false; lastPoint = null; });
  canvas.addEventListener('mouseleave', function () { cursor.hidden = true; });

  document.getElementById('undoBtn').addEventListener('click', function () {
    var prev = undoStack.pop();
    if (prev) ctx.putImageData(prev, 0, 0);
  });
  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!initDone) return;
    try {
      pushUndo();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(originalCanvas, 0, 0);
    } catch (err) {
      console.error('Reset to original failed:', err);
      alert("Couldn't reset — try reloading this page.");
    }
  });

  document.getElementById('saveBtn').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    var label = btn.querySelector('.btnlabel');
    if (label) label.textContent = 'saving…';
    canvas.toBlob(function (blob) {
      var form = new FormData();
      form.append('image', blob, 'touchup.png');
      fetch(window.location.pathname, { method: 'POST', body: form })
        .then(function (res) {
          if (!res.ok) throw new Error('save failed');
          window.location.href = "{{ url_for('edit_item', item_id=item_id) }}";
        })
        .catch(function () {
          btn.disabled = false;
          if (label) label.textContent = 'save changes';
          alert("Couldn't save that — try again.");
        });
    }, 'image/png');
  });
})();
</script>
{% endblock %}
